server.address=127.0.0.1
server.port=8787
spring.main.banner-mode=off
spring.mvc.async.request-timeout=-1

# Run history, imported release packages and measured scores live in an embedded H2 database.
# Set TWINGUARD_DATA_DIR to choose where it's kept.
spring.datasource.url=jdbc:h2:file:${TWINGUARD_DATA_DIR:./twinguard-data}/twinguard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
